name: Volante
options:
  bundleIdPrefix: com.tommasomaggiolo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Volante:
    type: application
    platform: iOS
    sources:
      - path: Volante
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommasomaggiolo.volante
        INFOPLIST_FILE: Volante/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
